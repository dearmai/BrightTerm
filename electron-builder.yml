appId: kr.balkeunter.brightterm
productName: BrightTerm
copyright: Copyright (c) 2026 Dany Kim
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
  - resources/**
  - '!**/*.map'
  - '!node_modules/cpu-features/**'
  - '!node_modules/ssh2/lib/protocol/crypto/build/**'
  - '!node_modules/@serialport/bindings-cpp/build/**'
  - '!node_modules/node-pty/{src,deps,third_party,scripts,typings}/**'
  - '!node_modules/node-pty/**/*.pdb'
  - '!test/**'
asarUnpack:
  - node_modules/@serialport/**
  - node_modules/cpu-features/**
  - node_modules/node-pty/**
npmRebuild: false
beforePack: scripts/prepare-macos-signing.cjs
# 법적 고지 — 설치된 앱의 resources/legal/ 에 들어가고 설정 → 정보에서 연다
extraResources:
  - from: LICENSE
    to: legal/LICENSE.txt
  - from: NOTICE
    to: legal/NOTICE.txt
  - from: TRADEMARKS.md
    to: legal/TRADEMARKS.md
  - from: THIRD_PARTY_NOTICES.txt
    to: legal/THIRD_PARTY_NOTICES.txt
  - from: node_modules/electron/dist/LICENSE
    to: legal/LICENSE.electron.txt
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: legal/LICENSES.chromium.html
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}-${target}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: BrightTerm
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-Portable-${version}.${ext}
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.png
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  # 로컬 배포: 전용 자체 서명 인증서를 생성·재사용한다.
  # custom sign이 실제 인증서를 지정하며, 로컬 빌드는 타임스탬프·공증을 요청하지 않는다.
  identity: BrightTerm Local Development
  sign: scripts/sign-macos-local.cjs
  notarize: false
  hardenedRuntime: false
  extendInfo:
    NSLocalNetworkUsageDescription: 사내 네트워크(192.168.x.x 등)의 SSH·텔넷 서버에 접속하려면 로컬 네트워크 접근이 필요합니다.
dmg:
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
linux:
  syncDesktopName: true
  target: [AppImage, deb]
  icon: build/icons
  category: TerminalEmulator
  maintainer: Dany Kim
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
publish: null
