<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <!-- IronRDP(WASM) — wasm 은 data: URL 로 들어 있고, 중계는 이 기기 안(127.0.0.1)의 WebSocket -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: ws://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>원격 데스크톱</title>
    <link rel="stylesheet" href="rdp.css" />
    <script type="module" src="rdp.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="bar">
        <span id="dot" class="dot"></span>
        <b id="title">원격 데스크톱</b>
        <span id="sub" class="muted"></span>
        <span class="grow"></span>
        <button id="kbd" title="키보드">⌨</button>
        <button id="keys-btn" title="특수 키">Fn</button>
        <button id="zoom-reset" title="확대 원래대로" hidden>1×</button>
        <button id="settings-btn" title="화면·화질·소리 설정">⚙</button>
        <button id="disconnect" title="연결 끊기">끊기</button>
      </div>
      <div id="keys" hidden>
        <button data-mod="ctrl">Ctrl</button><button data-mod="alt">Alt</button><button data-mod="shift">Shift</button><button data-mod="win">⊞ Win</button>
        <button data-key="Escape">Esc</button><button data-key="Tab">Tab</button><button data-key="Delete">Del</button>
        <button data-key="ArrowLeft">←</button><button data-key="ArrowUp">↑</button><button data-key="ArrowDown">↓</button><button data-key="ArrowRight">→</button>
        <button data-key="Home">Home</button><button data-key="End">End</button><button data-key="PageUp">PgUp</button><button data-key="PageDown">PgDn</button>
        <button data-special="cad">Ctrl+Alt+Del</button>
        <button data-special="paste" title="이 기기 클립보드 글자를 입력">붙여넣기 입력</button>
      </div>
      <div id="warn" hidden></div>
      <div id="screen">
        <div id="stage"></div>
        <div id="cursor" hidden></div>
        <div id="touch"></div>
      </div>
      <textarea id="ime" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="원격 입력"></textarea>
      <div id="overlay">
        <div class="card" id="card"></div>
      </div>
      <div id="panel" hidden></div>
    </div>
  </body>
</html>
