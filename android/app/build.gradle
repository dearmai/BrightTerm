plugins { id 'com.android.application' }

android {
    namespace 'kr.balkeunter.brightterm'
    compileSdk 36
    defaultConfig {
        applicationId 'kr.balkeunter.brightterm'
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName '1.2.3-android.1'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { resources.excludes += ['META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'] }
    lint { abortOnError true }
}

dependencies {
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'com.github.mwiede:jsch:2.28.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.83'
    implementation 'androidx.webkit:webkit:1.14.0'
}

// Bundle the same terminal engine as Electron; no CDN or runtime web dependencies.
def terminalAssets = tasks.register('terminalAssets', Copy) {
    from('../../node_modules/@xterm/xterm/lib') { include 'xterm.js' }
    from('../../node_modules/@xterm/xterm/css') { include 'xterm.css' }
    from('../../node_modules/@xterm/addon-fit/lib') { include 'addon-fit.js' }
    into layout.buildDirectory.dir('generated/terminalAssets/vendor')
    doFirst {
        if (!file('../../node_modules/@xterm/xterm/lib/xterm.js').exists())
            throw new GradleException('Run npm ci --ignore-scripts in the repository root first.')
    }
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/terminalAssets'))
tasks.named('preBuild').configure { dependsOn terminalAssets }

def notices = tasks.register('androidNotices') {
    inputs.files(rootProject.file('../LICENSE'), rootProject.file('../NOTICE'), rootProject.file('THIRD_PARTY_NOTICES.txt'))
    outputs.file(layout.buildDirectory.file('generated/terminalAssets/NOTICE.txt'))
    doLast {
        def output = layout.buildDirectory.file('generated/terminalAssets/NOTICE.txt').get().asFile
        output.parentFile.mkdirs()
        output.text = rootProject.file('../NOTICE').text + '\n\n' + rootProject.file('../LICENSE').text + '\n\n' + rootProject.file('THIRD_PARTY_NOTICES.txt').text
    }
}
tasks.named('preBuild').configure { dependsOn notices }
